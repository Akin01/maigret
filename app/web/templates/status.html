{% extends "base.html" %}
{% block content %}
<div class="text-center py-16">
    <h2 class="text-3xl font-bold mb-4">Search in progress...</h2>
    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">Your request is being processed. This page will automatically redirect when the results are ready.</p>
    <div class="flex justify-center items-center">
        <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>
    <script>
    // Auto-refresh the page every 5 seconds to check completion
    setTimeout(function() {
        window.location.reload();
    }, 5000);
    </script>
</div>
{% endblock %}
