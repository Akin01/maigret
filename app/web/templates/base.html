<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maigret Web Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"}
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .form-container {
                @apply max-w-4xl mx-auto pb-8;
            }
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <header class="py-4 mb-8 border-b border-gray-200 dark:border-gray-700">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img src="{{ url_for('static', path='maigret.png') }}" alt="Maigret Logo" class="h-10 w-auto">
                    <h1 class="text-xl font-bold">Maigret Web Interface</h1>
                </div>
                <button id="theme-toggle" class="px-4 py-2 rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                    Toggle Theme
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 container mx-auto px-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto py-4 text-center border-t border-gray-200 dark:border-gray-700 text-sm">
        <div class="container mx-auto px-4">
            <p>
                Powered by <a href="https://github.com/soxoj/maigret" target="_blank" class="hover:underline">Maigret</a> |
                Licensed under <a href="https://github.com/soxoj/maigret/blob/main/LICENSE" target="_blank" class="hover:underline">MIT License</a>
            </p>
        </div>
    </footer>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;

        themeToggle.addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
            localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
        } else {
            htmlEl.classList.remove('dark');
        }
    </script>
</body>

</html>
